[package]
name = "glyphmosaic"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Turn video frames into a mosaic of Unicode font glyphs"
license = "MIT OR Apache-2.0"

[lib]
name = "glyphmosaic"
path = "src/lib.rs"

[[bin]]
name = "glyphmosaic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
ttf-parser = "0.25"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"
lru = "0.12"
memmap2 = "0.9"
indicatif = "0.17"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
